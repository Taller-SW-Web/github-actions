name: Shared Actions Validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  policy-tests:
    name: Authorization and Analysis Policy Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.cjs
